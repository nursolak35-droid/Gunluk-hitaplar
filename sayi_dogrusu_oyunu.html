<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sayı Doğrusu | Sınıf Gezegeni</title><style>*{box-sizing:border-box}body{margin:0;background:#101735;color:#fff;font-family:Arial,sans-serif;min-height:100svh;display:grid;place-items:center}.app{width:min(1100px,96vw);text-align:center;padding:20px}header{display:flex;justify-content:space-between;align-items:center;color:#c6ccf6}h1{font-size:clamp(25px,4vw,46px);margin:22px 0 8px}p{font-size:clamp(17px,2.4vw,25px)}.card{background:#fff;color:#1b2548;border-radius:28px;padding:25px 15px;margin:22px 0;box-shadow:0 15px 50px #0004}svg{width:100%;height:auto;max-height:240px;display:block}#nearest p{margin:10px}#nearest small{display:block;margin:10px;color:#c6ccf6}#nearest[hidden]{display:none}.options button:disabled{cursor:default}.options{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:16px;padding:15px 25px;background:#dce4ff;color:#192449;touch-action:manipulation}button:hover{background:#bacbff}button:focus-visible{outline:4px solid #ffbf45}.options button{font-size:30px;min-width:90px;background:#ffcf64}#feedback{min-height:42px;font-size:24px;font-weight:bold;margin:15px 0}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}select{font:inherit;padding:10px;border-radius:10px}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;animation:fall 1.4s ease-in forwards}@keyframes fall{to{transform:translateY(100vh) rotate(540deg)}}@media(max-height:650px){.app{padding:8px}h1{margin:8px}p{margin:6px}.card{margin:10px 0;padding:8px}svg{max-height:190px}#feedback{margin:8px}}</style><main class="app"><header><b>🪐 Sınıf Gezegeni</b><span id="score"></span><button id="sound" aria-label="Sesi aç veya kapat">Ses: Açık</button></header><h1>🚀 Kayıp Sayıyı Bul!</h1><p>Soru işaretinin yerindeki sayı hangisi?</p><div class="card"><svg id="line" viewBox="0 0 1000 210" role="img" aria-label="Eksik sayılı sayı doğrusu"></svg></div><div class="options" id="options"></div><section id="nearest" hidden><p id="nearTitle">Kayıp sayıya en yakın onluk hangisi?</p><div class="options" id="nearOptions"></div><small>5 ile biten sayılar bir üst onluğa yuvarlanır.</small></section><div id="feedback" role="status" aria-live="polite"></div><div class="controls"><select id="mode" aria-label="Sayma biçimi"><option value="1">Birer sayma</option><option value="2">İkişer sayma</option><option value="10">Onar sayma</option></select><select id="level" aria-label="Sayı aralığı"><option value="20">1–20</option><option value="50">1–50</option><option value="100" selected>1–100</option></select><button id="next">Yeni soru →</button><button id="reset">Yeniden başla</button><button id="full">⛶ Tam ekran</button></div><div id="confetti"></div></main><script>
let correct=0,round=0,answer=0,solved=false,sound=true,ctx;const $=id=>document.getElementById(id);function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function tone(ok){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?740:220;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.start();o.stop(ctx.currentTime+.25)}catch(e){}}function stars(){for(let i=0;i<30;i++){let p=document.createElement('span');p.className='piece';p.textContent=['⭐','✨','🟡','🔵'][i%4];p.style.left=rand(0,98)+'%';p.style.fontSize=rand(15,28)+'px';p.style.animationDelay=Math.random()*.3+'s';$('confetti').append(p);setTimeout(()=>p.remove(),1800)}}function update(){$('score').textContent='⭐ '+correct+' doğru · '+round+' soru'}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeRound(max,step){let start,missing=rand(1,9);if(step===1)start=rand(0,max/10-1)*10;else if(step===10)start=0;else start=rand(0,(max-20)/2)*2;let answer=start+missing*step;return {start,missing,answer,step,lower:Math.floor(answer/10)*10,upper:Math.ceil(answer/10)*10,nearest:Math.round(answer/10)*10}}
function feedback(t,ok){$('feedback').textContent=t;$('feedback').style.color=ok?'#88efc0':'#ffd273'}
function question(){solved=false;let lostFound=false;const max=+$('level').value,step=+$('mode').value;const r=makeRound(max,step);answer=r.answer;$('nearest').hidden=true;$('nearOptions').replaceChildren();$('feedback').textContent='';let svg='<line x1="60" y1="85" x2="940" y2="85" stroke="#26345e" stroke-width="4"/>';
for(let i=0;i<=10;i++){let x=60+i*88,n=r.start+i*step,decade=n%10===0;svg+=`<line x1="${x}" y1="${decade?54:67}" x2="${x}" y2="100" stroke="${decade?'#6d48bd':'#26345e'}" stroke-width="${decade?4:3}"/>`;if(i===r.missing)svg+=`<rect x="${x-32}" y="119" width="64" height="59" rx="13" fill="#fff0c7" stroke="#e5a721" stroke-width="3"/><text id="missingLabel" x="${x}" y="161" text-anchor="middle" font-size="36" fill="#26345e">?</text>`;else svg+=`<text x="${x}" y="158" text-anchor="middle" font-family="Arial" font-size="31" fill="${decade?'#6d48bd':'#26345e'}" font-weight="${decade?'bold':'normal'}">${n}</text>`;
}if(step===1)svg+=`<text x="500" y="205" text-anchor="middle" font-size="20" fill="#6d48bd">İki komşu onluk: ${r.start} ve ${r.start+10}</text>`;$('line').innerHTML=svg;$('line').setAttribute('aria-label',`${r.start} ile ${r.start+10*step} arasında ${step} artan sayı doğrusu; ${r.missing+1}. çizgideki sayı eksik.`);
let choices=new Set([answer]);while(choices.size<4){let n=answer+rand(-4,4)*step;if(n>=0&&n<=100)choices.add(n)}$('options').replaceChildren();shuffle([...choices]).forEach(n=>{let btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>{if(lostFound)return;if(n!==answer){feedback(step+' ileri sayarak tekrar dene.',false);btn.disabled=true;btn.style.opacity='.4';tone(false);return}lostFound=true;$('missingLabel').textContent=answer;tone(true);stars();[...$('options').children].forEach(b=>b.disabled=true);if(step===1){feedback('Doğru! Şimdi en yakın onluğu seç.',true);$('nearest').hidden=false;$('nearTitle').textContent=answer+' sayısına en yakın onluk hangisi?';[r.start,r.start+10].forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(solved)return;if(n===r.nearest){finish();[...$('nearOptions').children].forEach(b=>b.disabled=true)}else{feedback('Uzaklıkları karşılaştır. 5 ve üzerini üst onluğa yuvarla.',false);tone(false);b.disabled=true;b.style.opacity='.4'}};$('nearOptions').append(b)})}else finish()};$('options').append(btn)});function finish(){solved=true;correct++;round++;update();tone(true);stars();feedback(step===1?`Harika! ${answer} sayısının en yakın onluğu ${r.nearest}. ⭐`:'Harika! Doğru sayı '+answer+' ⭐',true)}update()}
$('next').onclick=()=>{if(!solved)round++;question()};$('reset').onclick=()=>{correct=round=0;question()};$('mode').onchange=()=>{correct=round=0;$('level').disabled=+$('mode').value===10;question()};$('level').onchange=()=>{correct=round=0;question()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Ses: '+(sound?'Açık':'Kapalı')};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};question();</script></html>
